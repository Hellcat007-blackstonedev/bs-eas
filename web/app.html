<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Emergency Alerts</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <main class="app">
        <header class="app-header">
            <div class="warning-icon">!</div>
            <div class="header-copy">
                <h1>Emergency Alerts</h1>
                <p>Official public safety information</p>
            </div>
        </header>

        <section>
            <div class="section-label">CURRENT ALERT</div>
            <div id="current-alert"></div>
        </section>

        <section>
            <div class="section-label">PREVIOUS ALERTS</div>
            <div id="alert-history"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
